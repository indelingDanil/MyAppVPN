name: proxylist

# ВАЖНО: файл должен лежать в ветке по умолчанию (main), иначе cron не сработает
# (GitHub запускает schedule только из workflow-файлов ветки по умолчанию).
# Работа идёт в ветке proxylist: checkout переключается на неё, туда же коммит.

on:
  schedule:
    - cron: '0 * * * *'   # раз в час (UTC)
  workflow_dispatch: {}

concurrency:
  group: proxylist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Каждый источник — отдельный параллельный job (matrix): fetch + xray-knife тест.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ['26', '1', '6', '22', '23', '24', '25']
    env:
      XK_VERSION: v10.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proxylist
          fetch-depth: 1

      - name: Cache xray-knife
        id: cache-xk
        uses: actions/cache@v4
        with:
          path: bin
          key: xray-knife-${{ env.XK_VERSION }}-linux-64

      - name: Install xray-knife
        if: steps.cache-xk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p bin
          url="https://github.com/lilendian0x00/xray-knife/releases/download/${XK_VERSION}/Xray-knife-linux-64.zip"
          curl -fsSL "$url" -o xk.zip
          unzip -o xk.zip -d bin
          binpath="$(find bin -type f -iname 'xray-knife*' ! -iname '*.zip' | head -n1)"
          [ "$binpath" = "bin/xray-knife" ] || cp "$binpath" bin/xray-knife
          chmod +x bin/xray-knife

      - name: Add xray-knife to PATH
        run: echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Fetch source ${{ matrix.source }}
        run: bash scripts/fetch.sh "https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/main/githubmirror/${{ matrix.source }}.txt"

      - name: Filter (Cloudflare + speed)
        run: bash scripts/filter.sh

      - name: Upload per-source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.source }}
          path: results.csv
          if-no-files-found: ignore
          retention-days: 1

  # Слить результаты всех источников, дедуп, отбор, коммит.
  merge:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proxylist
          fetch-depth: 0

      - name: Download all per-source results
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: results-*

      - name: Merge & build output
        env:
          ART_DIR: artifacts
        run: bash scripts/merge.sh

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name  "indelingDanil"
          git config user.email "106833130+indelingDanil@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Изменений в output/ нет."
          else
            git commit -m "chore: update filtered list [skip ci]"
            git push origin "HEAD:proxylist"
          fi
